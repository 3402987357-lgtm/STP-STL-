[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "stp-stl-missing-region-recognition"
version = "0.1.0"
description = "我用 STEP/STP 与完整 STL 的几何差异识别部件缺失区域。"
requires-python = ">=3.11"
dependencies = ["numpy>=1.26"]

[project.scripts]
cad-inspector = "cad_inspector.cli:main"
mold-manifest = "cad_inspector.dataset_cli:main"
mold-parting-baseline = "cad_inspector.parting_cli:main"
mold-features = "cad_inspector.feature_cli:main"
mold-step-face-features = "cad_inspector.cli:main"
mold-bom = "cad_inspector.bom_cli:main"
mold-visualize = "cad_inspector.visualization_cli:main"

[tool.setuptools.packages.find]
where = ["src"]
